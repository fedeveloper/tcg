name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Client type check (Svelte)
        run: pnpm check:client
      - name: Unit and property tests
        run: pnpm test
      - name: Card validator
        run: pnpm validate:cards
      - name: Localization check
        run: pnpm check:i18n
      - name: Simulation of 500 games
        run: pnpm sim --games 500 --ai random
      - name: Simulation with the easy AI
        run: pnpm sim --games 30 --ai easy --decks starter
      - name: Simulation with the medium AI
        run: pnpm sim --games 10 --ai medium --decks starter
      - name: PvP soak test (100 matches through the server)
        run: pnpm soak:pvp --games 100
      - name: Client build
        run: pnpm build
      - name: Server build
        run: pnpm build:server
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: packages/client/dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        # apt-get can fail when the Ubuntu mirrors are down. The runner image already has the main libraries,
        # so the job then installs only the browser.
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
      - name: End-to-end tests (tutorial, match against the AI, deck editor, online match)
        run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
